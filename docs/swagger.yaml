            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 保存 AI 生成的 OJ 题目
      tags:
      - AI OJ题目生成
  /ai/oj-question-gen/stream:
    post:
      consumes:
      - application/json
      description: |-
        OJ 题目生成正式业务入口。前端直接提交题目生成参数；后端内部转换为 oj_question_gen RuntimeRequest 并通过 ModuleGateway 执行。
        响应为 Server-Sent Events，每条消息格式为 event: message + data: StreamEvent JSON。
        请求示例：{"message":"生成 2 道数组相关 OJ 编程题","knowledge_points":["数组","循环"],"difficulty":"easy","count":2,"testcase_count":3,"standard_language":"python","additional_requirements":"题目场景贴近校园生活"}
      parameters:
      - description: OJ 题目生成请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/zk-code-arena-server_pkg_app_api-server_server_Doc.OJQuestionGenStreamRequestDoc'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE event stream
          schema:
            type: string
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "401":
          description: 未认证用户
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "409":
          description: 会话已有运行中的任务
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "503":
          description: 模块未注册或未配置
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: OJ 题目生成流式接口
      tags:
      - AI OJ题目生成
  /ai/teacher/copilot/stream:
    post:
      consumes:
