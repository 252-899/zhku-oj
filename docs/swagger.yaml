host: 118.195.215.81
info:
  contact:
    email: support@zkcodearena.com
    name: API Support
    url: http://localhost/support
  description: |-
    ZK Code Arena 在线编程平台 REST API 文档
    提供用户管理、题库管理、班级课程管理、代码评测等功能
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://localhost/terms/
  title: ZK Code Arena API
  version: "1.0"
paths:
  /admin/problems:
    get:
      consumes:
      - application/json
      description: 管理员端获取题目列表，可查看所有题目包括私有和草稿状态，支持按难度、标签筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 难度
        enum:
        - easy
        - medium
        - hard
        in: query
        name: difficulty
        type: string
      - collectionFormat: csv
        description: 标签列表
        in: query
        items:
          type: string
        name: tags
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: 题目列表
          schema:
            allOf:
            - $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
            - properties:
                data:
                  properties:
                    page:
                      type: integer
                    page_size:
                      type: integer
                    problems:
                      items:
                        $ref: '#/definitions/zk-code-arena-server_pkg_models.ProblemList'
                      type: array
                    total:
                      format: int64
                      type: integer
                    total_page:
                      format: int64
                      type: integer
                  type: object
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
        "401":
          description: 未授权访问
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
        "500":
          description: 获取失败
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取题目列表（管理员端）
      tags:
      - 题目
  /ai/agent/chat:
    post:
      consumes:
      - application/json
      description: |-
        Assistant 同步对话入口。当前同步接口走 AssistantGateway，请使用 agent_type，例如 websearchagent；module 任务请使用 /ai/agent/chat/stream。
        请求要求：message 必填；agent_type 必填；session_id 和 round_id 可不传，后端会自动生成。
      parameters:
      - description: Assistant 同步对话请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/zk-code-arena-server_pkg_app_api-server_server_Doc.AIAgentChatRequestDoc'
      produces:
      - application/json
      responses:
        "200":
          description: 对话结果
          schema:
            allOf:
            - $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zk-code-arena-server_pkg_ai_api.ChatResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "401":
          description: 未认证用户
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "409":
          description: 会话已有运行中的任务
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "503":
          description: Agent 未注册或未配置
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: AI Agent 同步对话
      tags:
      - AI Agent
  /ai/agent/chat/stream:
    post:
      consumes:
      - application/json
      description: |-
        Assistant/Module 统一流式入口，响应为 Server-Sent Events，每条消息格式为 event: message + data: StreamEvent JSON。
        Assistant 调用：传 agent_type，例如 websearchagent；Module 调用：传 task_kind=module 和 module_type。
        oj_question_gen 调用：module_type 固定为 oj_question_gen，业务参数放在 metadata.input 中；当前支持 knowledge_points、difficulty、count、testcase_count、standard_language、additional_requirements。
        oj_question_gen 请求示例：{"message":"生成 2 道数组相关 OJ 编程题","task_kind":"module","module_type":"oj_question_gen","metadata":{"input":{"knowledge_points":["数组","循环"],"difficulty":"easy","count":2,"testcase_count":3,"standard_language":"python","additional_requirements":"题目场景贴近校园生活"}}}
      parameters:
      - description: Assistant/Module 流式对话请求；oj_question_gen 参数放在 metadata.input
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/zk-code-arena-server_pkg_app_api-server_server_Doc.AIAgentStreamChatRequestDoc'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE event stream
          schema:
            type: string
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "401":
          description: 未认证用户
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "409":
          description: 会话已有运行中的任务
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "503":
          description: Agent 或 Module 未注册/未配置
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: AI Agent 流式对话
      tags:
      - AI Agent
  /ai/oj-question-gen/save:
    post:
      consumes:
      - application/json
      description: 教师从 AI 生成草稿中逐题选择是否公开和挂载课程，后端将选中题目写入正式题库。
      parameters:
